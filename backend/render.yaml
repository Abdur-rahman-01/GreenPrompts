services:
  - type: web
    name: greenprompt-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore   # Closest to India — reduces latency vs US East
    buildCommand: pip install -r requirements.txt
    # Use single worker (free tier = 0.1 vCPU) — uvicorn async handles concurrency
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --log-level warning --timeout-keep-alive 75
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELECTRICITY_MAPS_API_KEY
        sync: false
      # RENDER_EXTERNAL_URL must be set manually in the Render dashboard env vars
      # e.g. https://greenprompt-api.onrender.com — used for self-ping keepalive
    healthCheckPath: /health
    autoDeploy: true
